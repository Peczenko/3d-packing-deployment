apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing-worker
  namespace: packing
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: PACKING_ENGINE_OVERRUN_GRACE
              value: 15m
          resources:
            requests:
              cpu: "1"
              memory: 5Gi
            limits:
              cpu: "2"
              memory: 8Gi
