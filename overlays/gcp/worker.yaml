apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing-worker
  namespace: packing
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: "1"
              memory: 5Gi
            limits:
              cpu: "1"
              memory: 5Gi
