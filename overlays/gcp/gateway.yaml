apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: packing
  namespace: packing
spec:
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
    - name: websecure
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: packing-tls
      allowedRoutes:
        namespaces:
          from: Same
