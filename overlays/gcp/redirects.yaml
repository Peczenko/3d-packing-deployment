apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: packing
spec:
  parentRefs:
    - name: packing
      sectionName: web
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  namespace: packing
spec:
  parentRefs:
    - name: packing
      sectionName: websecure
  hostnames:
    - www.3dpacking.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: 3dpacking.dev
            statusCode: 301
