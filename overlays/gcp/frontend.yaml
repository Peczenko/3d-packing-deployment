apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: packing
spec:
  template:
    spec:
      containers:
        - name: frontend
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: frontend-config
