apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env
  namespace: packing
data:
  SPRING_PROFILES_ACTIVE: azure
  SPRING_CLOUD_AZURE_KEYVAULT_SECRET_PROPERTY_SOURCE_ENABLED: "false"
  SPRING_CLOUD_AZURE_CREDENTIAL_MANAGED_IDENTITY_ENABLED: "false"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  EMAIL_ENABLED: "true"
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: packing
  DB_SSL_ROOT_CERT: /etc/azure-postgres/ca.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: packing
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: api
          image: packing-backend
          envFrom:
            - configMapRef:
                name: api-env
            - secretRef:
                name: api-secrets
          env:
            - name: SPRING_CLOUD_AZURE_CREDENTIAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-sp
                  key: AZURE_CLIENT_ID
            - name: SPRING_CLOUD_AZURE_CREDENTIAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-sp
                  key: AZURE_CLIENT_SECRET
            - name: SPRING_CLOUD_AZURE_PROFILE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-sp
                  key: AZURE_TENANT_ID
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: azure-postgres-ca
              mountPath: /etc/azure-postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: azure-postgres-ca
          configMap:
            name: azure-postgres-ca
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: packing
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
