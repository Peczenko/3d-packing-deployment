apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: packing
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: schema
          image: temporalio/admin-tools:1.32.1
          command: ["sh", "/scripts/schema.sh"]
          envFrom:
            - configMapRef:
                name: temporal-config
            - secretRef:
                name: temporal-db
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: server
          image: temporalio/server:1.32.1
          envFrom:
            - configMapRef:
                name: temporal-config
            - secretRef:
                name: temporal-db
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            grpc:
              port: 7233
              service: temporal.api.workflowservice.v1.WorkflowService
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 7233
              service: temporal.api.workflowservice.v1.WorkflowService
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: dynamicconfig
              mountPath: /etc/temporal/dynamicconfig
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: temporal-scripts
        - name: dynamicconfig
          configMap:
            name: temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: packing
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
