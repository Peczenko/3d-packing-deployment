apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace
  namespace: packing
  labels:
    app.kubernetes.io/name: temporal-admin
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-admin
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: namespace
          image: temporalio/admin-tools:1.32.1
          command: ["sh", "/scripts/namespace.sh"]
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: packing
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: scripts
          configMap:
            name: temporal-scripts
