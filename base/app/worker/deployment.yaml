apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-storage
  namespace: packing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: packing-kv
  target:
    name: worker-storage
  data:
    - secretKey: STORAGE_ACCOUNT_URL
      remoteRef:
        key: storage-blob-endpoint
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing-worker
  namespace: packing
  labels:
    app.kubernetes.io/name: packing-worker
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: packing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: packing-worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: worker
          image: packing-worker
          envFrom:
            - secretRef:
                name: worker-storage
            - secretRef:
                name: azure-sp
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal:7233
            - name: TEMPORAL_NAMESPACE
              value: packing
            - name: STORAGE_CONTAINER_NAME
              value: models
            - name: PACKING_WORK_ROOT
              value: /work
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: work
          emptyDir: {}
