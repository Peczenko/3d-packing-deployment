apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-postgres-ingress
  namespace: packing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-egress-to-postgres
  namespace: packing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-postgres
      ports:
        - protocol: TCP
          port: 5432
