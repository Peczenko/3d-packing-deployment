apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-self
  namespace: packing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 6933
          endPort: 6939
        - protocol: TCP
          port: 7233
          endPort: 7239
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal
      ports:
        - protocol: TCP
          port: 6933
          endPort: 6939
        - protocol: TCP
          port: 7233
          endPort: 7239
