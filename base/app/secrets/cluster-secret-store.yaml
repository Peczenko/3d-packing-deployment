apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: packing-kv
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://packing-kv.vault.azure.net
      authSecretRef:
        tenantId:
          name: azure-sp
          namespace: packing
          key: AZURE_TENANT_ID
        clientId:
          name: azure-sp
          namespace: packing
          key: AZURE_CLIENT_ID
        clientSecret:
          name: azure-sp
          namespace: packing
          key: AZURE_CLIENT_SECRET
