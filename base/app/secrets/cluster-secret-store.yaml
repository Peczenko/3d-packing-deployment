apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: packing-kv
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://packing-kv.vault.azure.net
      tenantId: d0da435b-a7e7-4d74-a4ae-f72cf8f3b2db
      authSecretRef:
        clientId:
          name: azure-sp
          namespace: packing
          key: AZURE_CLIENT_ID
        clientSecret:
          name: azure-sp
          namespace: packing
          key: AZURE_CLIENT_SECRET
