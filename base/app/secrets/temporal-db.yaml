apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-db
  namespace: packing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: packing-kv
  target:
    name: temporal-db
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: temporal-local-db-username
    - secretKey: POSTGRES_PWD
      remoteRef:
        key: temporal-local-db-password
