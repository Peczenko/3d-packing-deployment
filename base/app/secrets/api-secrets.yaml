apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: packing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: packing-kv
  target:
    name: api-secrets
  data:
    - secretKey: DB_ENDPOINT
      remoteRef:
        key: db-endpoint
    - secretKey: DB_USERNAME
      remoteRef:
        key: db-username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-password
    - secretKey: FIREBASE_PROJECT_ID
      remoteRef:
        key: firebase-project-id
    - secretKey: FIREBASE_SERVICE_ACCOUNT
      remoteRef:
        key: firebase-service-account
    - secretKey: STORAGE_BLOB_ENDPOINT
      remoteRef:
        key: storage-blob-endpoint
    - secretKey: BREVO_API_KEY
      remoteRef:
        key: brevo-api-key
    - secretKey: ALERTS_RECIPIENTS
      remoteRef:
        key: alerts-recipients
