apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./overlays/gcp
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
